<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Model Viewer</title>
    
    <!-- Подключаем шрифт Inter для современного вида -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0f172a;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-color: #f8fafc;
            --card-bg: rgba(30, 41, 59, 0.7);
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            /* Красивый градиентный фон */
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            font-family: 'Inter', sans-serif;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* Контейнер приложения (Карточка) */
        .app-container {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            width: 90%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: var(--shadow);
            transition: transform 0.3s ease;
        }

        h1 {
            font-weight: 800;
            margin-bottom: 30px;
            text-align: center;
            font-size: 1.8rem;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Стили кнопки */
        .start-btn {
            background: linear-gradient(135deg, var(--accent-color), #8b5cf6);
            border: none;
            border-radius: 12px;
            padding: 16px 48px;
            color: white;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
            margin-bottom: 30px;
            outline: none;
        }

        .start-btn:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.6);
        }

        .start-btn:active {
            transform: translateY(1px);
        }

        /* Обертка для видео (скрывает острые углы канваса) */
        .video-wrapper {
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            width: 200px; /* Фиксируем размер контейнера под скрипт */
            height: 200px;
            background: #000;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
        }

        /* Стили для результатов */
        #label-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        /* Стилизация динамически добавляемых div внутри label-container */
        #label-container div {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #cbd5e1;
            border-left: 4px solid var(--accent-color);
            text-align: center;
        }
        
        /* Если нужно сделать текст еще крупнее, можно раскомментировать следующее:
        #label-container div span {
            font-size: 1.5em;
            color: #fff;
        } */

    </style>
</head>
<body>

<div class="app-container">
    <h1>Machine Learning Vision</h1>
    
    <button type="button" onclick="init()" class="start-btn">Start System</button>
    
    <div class="video-wrapper">
        <div id="webcam-container"></div>
    </div>
    
    <div id="label-container"></div>
</div>

<!-- Библиотеки (как в оригинале) -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

<script type="text/javascript">
    // More API functions here:
    // https://github.com/googlecreativelab/teachablemachine-community/tree/master/libraries/image

    // the link to your model provided by Teachable Machine export panel
    const URL = "https://teachablemachine.withgoogle.com/models/es-9w7uTa/";

    let model, webcam, labelContainer, maxPredictions;

    // Load the image model and setup the webcam
    async function init() {
        const btn = document.querySelector('.start-btn');
        btn.style.opacity = "0.5";
        btn.textContent = "Loading AI...";

        const modelURL = URL + "model.json";
        const metadataURL = URL + "metadata.json";

        // load the model and metadata
        try {
            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            // Convenience function to setup a webcam
            const flip = true; // whether to flip the webcam
            webcam = new tmImage.Webcam(200, 200, flip); // width, height, flip
            
            // Небольшая задержка, чтобы интерфейс успел обновиться
            await new Promise(resolve => setTimeout(resolve, 100));
            
            await webcam.setup(); // request access to the webcam
            await webcam.play();
            window.requestAnimationFrame(loop);

            // append elements to the DOM
            document.getElementById("webcam-container").appendChild(webcam.canvas);
            labelContainer = document.getElementById("label-container");
            for (let i = 0; i < maxPredictions; i++) { // and class labels
                labelContainer.appendChild(document.createElement("div"));
            }
            
            btn.textContent = "System Active";
            btn.style.background = "#10b981"; // Зеленый цвет активности
        } catch (error) {
            console.error(error);
            btn.textContent = "Error Loading";
        }
    }

    async function loop() {
        webcam.update(); // update the webcam frame
        await predict();
        window.requestAnimationFrame(loop);
    }

    // run the webcam image through the image model
    async function predict() {
        // predict can take in an image, video or canvas html element
        const prediction = await model.predict(webcam.canvas);
        for (let i = 0; i < maxPredictions; i++) {
            const classPrediction =
                prediction[i].className + ": " + (prediction[i].probability * 100).toFixed(0) + "%";
            labelContainer.childNodes[i].innerHTML = classPrediction;
            
            // Визуальное выделение самой вероятной категории
            labelContainer.childNodes[i].style.borderLeftWidth = prediction[i].probability > 0.8 ? "6px" : "4px";
            labelContainer.childNodes[i].style.color = prediction[i].probability > 0.8 ? "#fff" : "#cbd5e1";
        }
    }
</script>

</body>
</html>
