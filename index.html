<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teachable Machine - Интеллектуальное Распознавание</title>
    <!-- Подключаем красивый современный шрифт Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 20px;
        }

        .app-container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 40px;
            width: 100%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 
                        0 0 40px rgba(99, 102, 241, 0.1);
        }

        h1 {
            font-size: 16px;
            font-weight: 700;
            color: #818cf8;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        /* Контейнер веб-камеры по центру, с закругленными углами */
        #webcam-container {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 0 auto 35px auto;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2), 
                        0 20px 30px rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.15);
            background: #020617;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        #webcam-container canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
            object-fit: cover;
            transform: scaleX(-1); /* Зеркальное отображение для удобства */
        }

        /* Крупный красивый шрифт для результатов под видео */
        #label-container {
            margin-bottom: 35px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .prediction-item {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 16px 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .prediction-item.active {
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.2) 0%, rgba(124, 58, 237, 0.2) 100%);
            border-color: rgba(129, 140, 248, 0.4);
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.15);
            transform: scale(1.02);
        }

        .class-label {
            font-size: 18px;
            font-weight: 600;
            color: #cbd5e1;
            text-align: left;
        }

        .prediction-item.active .class-label {
            color: #ffffff;
        }

        .class-prob {
            font-size: 22px;
            font-weight: 900;
            color: #94a3b8;
        }

        .prediction-item.active .class-prob {
            color: #34d399;
            text-shadow: 0 0 12px rgba(52, 211, 153, 0.4);
        }

        /* Большая яркая кнопка Start под текстом */
        .btn-start {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: #ffffff;
            border: none;
            padding: 18px 48px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.5), 
                        inset 0 -4px 0px rgba(0, 0, 0, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            width: 100%;
        }

        .btn-start:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px -5px rgba(79, 70, 229, 0.7), 
                        inset 0 -4px 0px rgba(0, 0, 0, 0.2);
            filter: brightness(1.1);
        }

        .btn-start:active {
            transform: translateY(1px);
            box-shadow: 0 5px 10px -5px rgba(79, 70, 229, 0.5);
        }

        /* Стили для летающих котиков */
        .cat-emoji {
            position: fixed;
            font-size: 36px;
            pointer-events: none;
            z-index: 9999;
            animation: floatAway 1.5s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes floatAway {
            0% {
                transform: translate(-50%, -50%) scale(0.3);
                opacity: 0;
            }
            15% {
                opacity: 1;
            }
            100% {
                transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.4) rotate(var(--rot));
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <h1>Teachable Machine Image Model</h1>
        
        <!-- Окно веб-камеры -->
        <div id="webcam-container"></div>
        
        <!-- Контейнер результатов (крупный шрифт) -->
        <div id="label-container"></div>
        
        <!-- Кнопка 'Start' в самом низу под текстом -->
        <button class="btn-start" type="button" onclick="init()">Start</button>
    </div>

    <!-- Подключаем оригинальные скрипты TensorFlow и Teachable Machine -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    
    <!-- Дополнительно подключаем легковесную библиотеку конфетти через CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

    <script type="text/javascript">
        // Ссылка на вашу модель из панели Teachable Machine
        const URL = "https://teachablemachine.withgoogle.com/models/es-9w7uTa/";

        let model, webcam, labelContainer, maxPredictions;
        
        // Переменные контроля состояний для анимации и голоса
        let activeEffect = null; 
        let lastSpokenTime = 0;
        let catInterval = null;

        // Инициализация модели и камеры
        async function init() {
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            const flip = true; 
            webcam = new tmImage.Webcam(200, 200, flip); 
            await webcam.setup(); 
            await webcam.play();
            window.requestAnimationFrame(loop);

            // Добавляем канвас в стилизованный контейнер DOM
            document.getElementById("webcam-container").appendChild(webcam.canvas);
            labelContainer = document.getElementById("label-container");
            
            // Создаем кастомную разметку под каждый класс для красивого отображения
            for (let i = 0; i < maxPredictions; i++) {
                const item = document.createElement("div");
                item.className = "prediction-item";
                item.innerHTML = `
                    <span class="class-label">Ожидание...</span>
                    <span class="class-prob">0%</span>
                `;
                labelContainer.appendChild(item);
            }
            
            // Скрываем кнопку после успешной активации (опционально, для красоты)
            document.querySelector('.btn-start').style.display = 'none';
        }

        async function loop() {
            webcam.update(); 
            await predict();
            window.requestAnimationFrame(loop);
        }

        // Обработка предсказаний нейросети
        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            
            let highestProb = 0;
            let highestIndex = -1;

            for (let i = 0; i < maxPredictions; i++) {
                const prob = prediction[i].probability;
                const percent = (prob * 100).toFixed(0) + "%";
                
                // Находим элемент строки
                const item = labelContainer.childNodes[i];
                if (item) {
                    item.innerHTML = `
                        <span class="class-label">${prediction[i].className}</span>
                        <span class="class-prob">${percent}</span>
                    `;
                }

                // Ищем доминирующий класс с максимальной уверенностью
                if (prob > highestProb) {
                    highestProb = prob;
                    highestIndex = i;
                }
            }

            // Логика визуальных и звуковых эффектов (порог уверенности > 80%)
            if (highestProb > 0.80) {
                // Подсвечиваем активную карточку класса
                for (let i = 0; i < maxPredictions; i++) {
                    if (i === highestIndex) {
                        labelContainer.childNodes[i].classList.add('active');
                    } else {
                        labelContainer.childNodes[i].classList.remove('active');
                    }
                }

                // Индекс 0 = Класс 1 (Конфетти + Голос)
                if (highestIndex === 0) {
                    if (activeEffect !== 'class1') {
                        activeEffect = 'class1';
                        stopCats();
                        triggerConfettiLoop();
                        speakVoice("Класс один");
                    }
                } 
                // Индекс 1 = Класс 2 (Эмодзи котиков вокруг камеры)
                else if (highestIndex === 1) {
                    if (activeEffect !== 'class2') {
                        activeEffect = 'class2';
                        startCats();
                    }
                } else {
                    resetEffects();
                }
            } else {
                // Если уверенность модели слабая, убираем эффекты и подсветки
                for (let i = 0; i < maxPredictions; i++) {
                    labelContainer.childNodes[i].classList.remove('active');
                }
                resetEffects();
            }
        }

        // Функция воспроизведения голоса (синтез речи браузера)
        function speakVoice(text) {
            const now = Date.now();
            // Защита от спама звуками (не чаще раза в 3 секунды для одного класса)
            if (now - lastSpokenTime > 3000) {
                window.speechSynthesis.cancel(); // сбрасываем предыдущую очередь
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ru-RU';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
                lastSpokenTime = now;
            }
        }

        // Функция запуска взрыва конфетти
        function triggerConfettiLoop() {
            confetti({
                particleCount: 120,
                spread: 70,
                origin: { y: 0.6 }
            });
        }

        // Функция генерации летающих котиков вокруг камеры
        function startCats() {
            if (catInterval) return;
            const camContainer = document.getElementById('webcam-container');
            
            catInterval = setInterval(() => {
                const emoji = document.createElement('div');
                emoji.className = 'cat-emoji';
                emoji.innerText = '🐱';

                // Определяем координаты центра веб-камеры
                const rect = camContainer.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;

                emoji.style.left = `${centerX}px`;
                emoji.style.top = `${centerY}px`;

                // Случайный разлет в стороны
                const angle = Math.random() * Math.PI * 2;
                const distance = 120 + Math.random() * 100;
                const dx = Math.cos(angle) * distance + 'px';
                const dy = Math.sin(angle) * distance + 'px';
                const rot = (Math.random() * 360) + 'deg';

                emoji.style.setProperty('--dx', dx);
                emoji.style.setProperty('--dy', dy);
                emoji.style.setProperty('--rot', rot);

                document.body.appendChild(emoji);
                
                // Удаляем элемент после завершения анимации
                setTimeout(() => emoji.remove(), 1500);
            }, 150);
        }

        function stopCats() {
            if (catInterval) {
                clearInterval(catInterval);
                catInterval = null;
            }
        }

        function resetEffects() {
            activeEffect = null;
            stopCats();
        }
    </script>
</body>
</html>
